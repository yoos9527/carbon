# 生产环境：不提供任何默认密钥，缺失即启动失败（fail-fast）
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:carbon}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true&rewriteBatchedStatements=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: carbon-hikari
      maximum-pool-size: ${DB_POOL_SIZE:50}
      minimum-idle: 10
      connection-timeout: 3000

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DB:0}
      timeout: 3s

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: warn
    com.carbon: info
  file:
    name: ${LOG_DIR:/var/log/carbon}/carbon.log
