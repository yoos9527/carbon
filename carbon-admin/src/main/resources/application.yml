server:
  port: 8080
  shutdown: graceful
  servlet:
    context-path: /

spring:
  application:
    name: carbon
  profiles:
    # 由 Maven profile 注入：local | dev | prod
    active: @profiles.active@
  threads:
    virtual:
      # JDK 21 已支持，但本项目 HTTP 出口是池化的 HttpClient5，
      # 线程数不是瓶颈；开启前需先评估虚拟线程在阻塞 IO 上的 pinning 情况。
      enabled: false
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  lifecycle:
    timeout-per-shutdown-phase: 20s
  # Quartz 不在这里配：Spring Boot 的 Quartz 自动配置在 initialize-schema=never 时
  # 拿不到 DataSource（启动即 SchedulerConfigException: DataSource name not set），
  # 因此改由 com.carbon.modules.job.config.QuartzConfig 显式装配，配置只留那一处。
  flyway:
    enabled: true
    # 表结构与 docs/02-数据模型.md 同步的母本 = script/sql/carbon.sql
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

# MyBatis-Plus：约定优先，业务侧只写 XML 或 Wrapper
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    banner: false
    db-config:
      id-type: assign_id          # 雪花 ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,startup,env
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /doc
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    root: info
    com.carbon: debug
    org.springframework.web: info
